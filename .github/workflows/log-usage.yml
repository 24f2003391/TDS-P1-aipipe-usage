name: Log AI Pipe usage

on:
  schedule:
    - cron: "15 */6 * * *"   # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the logs

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch usage feed
        run: bash scripts/log_usage.sh

      - name: Commit logs
        run: |
          git config user.name "usage-logger"
          git config user.email "usage-logger@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -m "Log usage $(date -u +%F\ %H:%M) UTC"
          git push
